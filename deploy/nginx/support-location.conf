# Customer Support Agent demo: proxied to the app (Compose project `support`, 127.0.0.1:8003).
# Same prefix-stripping pattern as /projects/rag/: the app runs with ROOT_PATH=/projects/support
# for the API docs, and the UI's URLs are relative. Goes inside the matheusramos.dev server block;
# needs support-limits.conf at the top of the file.
# Source of truth: ai-customer-support-agent/deploy/nginx/support-location.conf
location = /projects/support {
    return 301 /projects/support/;
}

location /projects/support/ {
    expires -1;  # same as /projects/rag/
    client_max_body_size 64k;
    limit_req zone=support_api burst=20 nodelay;
    limit_req_status 429;

    # Any add_header here drops every one inherited from the server block (nginx < 1.29.3), so
    # they are all repeated. Only the CSP differs: Cloudflare Turnstile's script and iframe, for
    # admitting a Demo Visitor. Nested locations without add_header inherit these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://static.cloudflareinsights.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_pass http://127.0.0.1:8003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $support_client_ip;
    proxy_set_header X-Forwarded-For $support_client_ip;
    proxy_set_header X-Forwarded-Proto https;

    location = /projects/support/chat {
        limit_req zone=support_chat burst=6 nodelay;
        proxy_pass http://127.0.0.1:8003/chat;
        # A turn may wait on the LLM for minutes (LLM_TIMEOUT_SECONDS, plus retries).
        proxy_read_timeout 300s;
    }

    # FastAPI's Swagger UI loads its bundle from cdn.jsdelivr.net and starts it with an inline
    # script, so this page alone allows both. It shows only the OpenAPI schema.
    location = /projects/support/docs {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self'; connect-src 'self' https://static.cloudflareinsights.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8003/docs;
    }
}
