# Customer support agent demo (/projects/support/): per client IP limits for support-location.conf.
# http context: goes at the top of the matheusramos.dev vhost file, outside every server block
# (see docs/deploy.md). Moved here from the support.matheusramos.dev vhost, which now only
# redirects: two files defining the same zone fail nginx -t.

# Behind the Cloudflare proxy every connection comes from a Cloudflare edge, so the client is
# CF-Connecting-IP, which Cloudflare overwrites. Only Cloudflare and private networks can reach
# nginx at all (conf.d/00-cloudflare-only.conf), so only a trusted network could forge it; without
# the header the key is the peer address. Not realip: it rewrites $remote_addr before the access
# phase, and the Cloudflare-only allowlist would then deny every real client.
map $http_cf_connecting_ip $support_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# A chat turn costs LLM calls: a few per minute is plenty for a person.
limit_req_zone $support_client_ip zone=support_chat:10m rate=12r/m;
limit_req_zone $support_client_ip zone=support_api:10m rate=5r/s;
